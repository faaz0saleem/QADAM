name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: schema, constraints and app
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Rebuilds a scratch database from supabase/migrations and runs everything
      # against it, so a migration that does not apply fails here rather than in
      # production. The §0 margin tests are the ones that matter most — see
      # db/test/margin_rule.test.mjs.
      - name: Tests
        run: npm test

      # The typechecker does not link the app. Bundling does, and it is what
      # catches a missing native module, a config file the module system cannot
      # parse, and an import that quietly drags in six megabytes of fonts.
      - name: Bundle
        run: npm run bundle
